<div id="app">
  <!-- step 1: language -->
  <section id="pickLang" class="screen">
    <div class="brand"><span class="wm">INTIQ</span><span class="by">by Peppermint</span></div>
    <div class="ask"><svg class="ico"><use href="#i-globe"/></svg><span>Choose language · भाषा चुनें · भाषा निवडा · ભાષા પસંદ કરો</span></div>
    <div class="tiles langs">
      <button type="button" data-lang="hi"><b lang="hi">हिंदी</b><small>Hindi</small></button>
      <button type="button" data-lang="en"><b>English</b><small>English</small></button>
      <button type="button" data-lang="mr"><b lang="mr">मराठी</b><small>Marathi</small></button>
      <button type="button" data-lang="gu"><b lang="gu">ગુજરાતી</b><small>Gujarati</small></button>
    </div>
  </section>

  <!-- step 2: who are you -->
  <section id="pickRole" class="screen" hidden>
    <div class="brand"><span class="wm">INTIQ</span><span class="by">by Peppermint</span></div>
    <div class="ask big" data-t="who">Who are you?</div>
    <div class="tiles roles">
      <button type="button" data-role="r"><span class="rico"><svg><use href="#i-shop"/></svg></span><b data-t="roleR">Retailer</b><small data-t="roleRs">I have a shop</small></button>
      <button type="button" data-role="b"><span class="rico"><svg><use href="#i-factory"/></svg></span><b data-t="roleB">Brand</b><small data-t="roleBs">I make or sell a brand</small></button>
    </div>
    <button type="button" class="back" id="backLang"><svg class="ico"><use href="#i-globe"/></svg><span data-t="lang">Language</span></button>
  </section>

  <!-- step 3: chat -->
  <section id="chat" class="screen" hidden>
    <header class="top">
      <div class="brand sm"><span class="wm">INTIQ</span><span class="by" id="roleTag"></span></div>
      <div class="tools">
        <button type="button" class="tb" id="bLang" aria-label="Language"><svg><use href="#i-globe"/></svg><span id="langShort">EN</span></button>
        <button type="button" class="tb" id="bSound" aria-label="Sound"><svg><use href="#i-sound"/></svg></button>
        <a class="tb call" id="bCall" href="tel:+917506399935" aria-label="Call"><svg><use href="#i-phone"/></svg><span data-t="call">Call</span></a>
      </div>
    </header>
    <main id="log" aria-live="polite"></main>
    <footer class="dock">
      <form id="typer" hidden autocomplete="off">
        <input id="q" type="text" enterkeyhint="send" data-tp="type" placeholder="Type your question">
        <button type="submit" class="sendb" aria-label="Send"><svg><use href="#i-send"/></svg></button>
      </form>
      <div class="row">
        <button type="button" class="side" id="bType" aria-label="Type"><svg><use href="#i-keyboard"/></svg></button>
        <div class="micwrap">
          <button type="button" id="mic" aria-label="Tap and speak"><span class="ring"></span><span class="ring r2"></span><svg class="m"><use href="#i-mic"/></svg><svg class="s"><use href="#i-stop"/></svg></button>
          <div class="miclab" id="micLab" data-t="tap">Tap and speak</div>
        </div>
        <button type="button" class="side" id="bAll" aria-label="All questions"><svg><use href="#i-grid"/></svg></button>
      </div>
    </footer>
  </section>

  <!-- all questions -->
  <div id="sheet" hidden>
    <div class="sheet-in">
      <div class="sheet-h"><button type="button" class="tb" id="bHome" aria-label="Start again"><svg><use href="#i-home"/></svg><span data-t="restart">Start again</span></button>
        <button type="button" class="tb" id="sheetX" aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
      <div class="qgrid" id="qgrid"></div>
    </div>
  </div>
</div>

<script src="assets/js/kb.js"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
